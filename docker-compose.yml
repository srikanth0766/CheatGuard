services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cheatguard
      POSTGRES_USER: cheatguard
      POSTGRES_PASSWORD: cheatguard
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cheatguard]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cheatguard:cheatguard@db:5432/cheatguard
      MODEL_PATH: /models/best_large.pt
      SAV_MODEL_PATH: /models/best_100.pt
    volumes:
      - ../best_large.pt:/models/best_large.pt:ro
      - ../sav_training/mini100/best_100.pt:/models/best_100.pt:ro
      - ./uploads:/app/uploads
      - ./evidence:/app/evidence
    ports: ["${API_PORT:-8001}:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8001}
    volumes: [./frontend:/app]
    ports: ["${FRONTEND_PORT:-5174}:5173"]
    depends_on: [api]
volumes:
  postgres_data:
